[phases.setup]
nixPkgs = [
  'php82',
  'php82Packages.composer',
  'php82Extensions.pdo',
  'php82Extensions.pdo_mysql',
  'php82Extensions.mysqlnd',
  'php82Extensions.mbstring',
  'php82Extensions.xml',
  'php82Extensions.tokenizer',
  'php82Extensions.zip',
  'php82Extensions.gd',
  'php82Extensions.fileinfo',
  'php82Extensions.curl',
  'php82Extensions.openssl',
  'php82Extensions.intl',
]

[variables]
NIXPACKS_PHP_EXTENSIONS = "pdo_mysql,mbstring,xml,tokenizer,zip,gd,fileinfo,curl,openssl,intl"

[phases.install]
cmds = ['composer install --no-dev --optimize-autoloader --no-interaction']

[phases.build]
cmds = [
  'php artisan config:cache',
  'php artisan route:cache',
  'php artisan view:cache',
  'php artisan storage:link --force',
]

[start]
cmd = 'php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT'
